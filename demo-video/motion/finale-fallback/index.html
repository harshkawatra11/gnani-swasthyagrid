<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap">
<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
<style>
  html, body { margin: 0; background: #f5f7fa; }
  #root { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: #f5f7fa; font-family: Geist, system-ui, sans-serif; color: #0f172a; }
  .grid { position: absolute; inset: 0; background-image: radial-gradient(#0f172a 1.2px, transparent 1.2px); background-size: 28px 28px; opacity: .05; }
  .glow { position: absolute; left: -260px; top: -320px; width: 1000px; height: 1000px; border-radius: 50%; background: radial-gradient(circle, rgba(15,159,122,.14), rgba(15,159,122,0) 68%); }
  .stmt { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 24px; }
  .eyebrow { font: 600 22px/1 'Geist Mono', monospace; letter-spacing: .18em; text-transform: uppercase; color: #0f9f7a; }
  .line { font: 600 74px/1.18 Geist; letter-spacing: -.03em; text-align: center; max-width: 1500px; }
  .line .w { display: inline-block; margin-right: .22em; }
</style>
</head>
<body>
<div id="root" data-composition-id="finale" data-width="1920" data-height="1080" data-start="0" data-duration="15">
  <div class="grid"></div><div class="glow"></div>

  <div id="s1" class="clip stmt" data-start="0.4" data-duration="4.4" data-track-index="1">
    <div class="eyebrow">Deterministic</div>
    <div class="line" id="s1line"><span class="w">Every</span><span class="w">decision</span><span class="w">is</span><span class="w">checkable</span><span class="w">arithmetic.</span></div>
  </div>

  <div id="s2" class="clip stmt" data-start="5.0" data-duration="4.4" data-track-index="1">
    <div class="eyebrow">Human in the loop</div>
    <div class="line" id="s2line"><span class="w">It</span><span class="w">proposes.</span><span class="w">An</span><span class="w">officer</span><span class="w">approves.</span></div>
  </div>

  <div id="s3" class="clip stmt" data-start="9.6" data-duration="5.0" data-track-index="1">
    <div class="eyebrow">Built to scale</div>
    <div class="line" id="s3line"><span class="w">One</span><span class="w">shared</span><span class="w">model.</span><span class="w">A</span><span class="w">new</span><span class="w">state</span><span class="w">plugs</span><span class="w">in</span><span class="w">without</span><span class="w">a</span><span class="w">rebuild.</span></div>
  </div>
</div>
<script>
  const tl = gsap.timeline({ paused: true });
  function beat(prefix, start, dur) {
    tl.from(`#${prefix} .eyebrow`, { opacity: 0, y: 10, duration: 0.4, ease: "power2.out" }, start);
    tl.from(`#${prefix}line .w`, { opacity: 0, y: 22, duration: 0.45, stagger: 0.06, ease: "power3.out" }, start + 0.15);
    tl.to(`#${prefix}`, { opacity: 0, duration: 0.4, ease: "power2.in" }, start + dur - 0.4);
  }
  beat("s1", 0.4, 4.4);
  beat("s2", 5.0, 4.4);
  beat("s3", 9.6, 5.0);
  window.__timelines = window.__timelines || {};
  window.__timelines["finale"] = tl;
</script>
</body>
</html>
